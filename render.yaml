services:
  - type: web
    name: talentflow-recruiter
    runtime: python
    plan: free
    branch: main
    buildCommand: >-
      pip install -r requirements.txt &&
      cd web && npm install && npm run build && cd ..
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
    autoDeploy: true
